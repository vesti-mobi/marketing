  <div id="root" class="relative z-10"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    const SQL_PERFIS = new Set(["Pro", "Starter", "Qualificado (Sem Faixa)"]);
    const PERFIL_ORDER = ["Pro", "Starter", "Qualificado (Sem Faixa)", "Multimarca", "Suporte", "Desqualificado", "Qualificação incompleta"];
    const MESES_LONG = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const fmtNumber = (n) => (n == null ? "—" : new Intl.NumberFormat("pt-BR").format(n));
    const fmtPct = (n) => (n == null || !isFinite(n) ? "—" : `${n.toFixed(1).replace(".", ",")}%`);
    const fmtBRL = (n) => (n == null || !isFinite(n) ? "—" : new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(n));

    // dd/mm/aaaa hh:mm:ss  → "YYYY-MM" ou null
    function leadMonthKey(str) {
      const m = String(str || "").match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      return m ? `${m[3]}-${m[2]}` : null;
    }
    // dd/mm/aaaa hh:mm:ss → Date (apenas ano/mes/dia)
    function parseLeadDay(str) {
      const m = String(str || "").match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
    }

    const dateOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dayKey = (d) => d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
    const fmtDateShort = (d) => d ? `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}` : "";
    const DOW_HEADERS = ["D","S","T","Q","Q","S","S"];

    // Primeira data (YYYY-MM-DD) com gasto > 0 do ad — usado pra calcular "Veiculando há X dias".
    function firstSpendDay(daily) {
      if (!daily) return null;
      let earliest = null;
      for (const day in daily) {
        if ((daily[day] || 0) <= 0) continue;
        if (!earliest || day < earliest) earliest = day;
      }
      return earliest;
    }

    function daysSince(isoDay) {
      if (!isoDay) return null;
      const m = isoDay.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const start = new Date(+m[1], +m[2] - 1, +m[3]);
      const today = dateOnly(new Date());
      const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
      return diff < 0 ? 0 : diff;
    }

    // Soma gasto diário de UM ad respeitando os filtros de período (anos/meses/range).
    // Os filtros de criativo/anuncio não se aplicam aqui — eles selecionam *qual* card aparece, não o range temporal.
    function spendInRange(daily, { years, months, dateFrom, dateTo } = {}) {
      if (!daily) return 0;
      const fromK = dateFrom ? dayKey(dateFrom) : null;
      const toK   = dateTo   ? dayKey(dateTo)   : null;
      let s = 0;
      for (const day in daily) {
        const m = day.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) continue;
        const [, y, mm, dd] = m;
        if (years && years.size > 0 && !years.has(y)) continue;
        if (months && months.size > 0 && !months.has(mm)) continue;
        if (fromK != null || toK != null) {
          const dk = +y * 10000 + +mm * 100 + +dd;
          if (fromK != null && dk < fromK) continue;
          if (toK   != null && dk > toK)   continue;
        }
        s += daily[day];
      }
      return +s.toFixed(2);
    }

    function applyFilters(leads, { years, months, criativos, anuncios, campanhas, adCampaign, dateFrom, dateTo } = {}) {
      const fromK = dateFrom ? dayKey(dateFrom) : null;
      const toK   = dateTo   ? dayKey(dateTo)   : null;
      const hasCampanhaFilter = campanhas && campanhas.size > 0;
      return leads.filter(l => {
        const k = leadMonthKey(l.data);
        const [ky, km] = k ? k.split("-") : [null, null];
        if (years && years.size > 0 && (!ky || !years.has(ky))) return false;
        if (months && months.size > 0 && (!km || !months.has(km))) return false;
        if (criativos && criativos.size > 0 && !criativos.has(l.criativo)) return false;
        if (anuncios && anuncios.size > 0 && !anuncios.has(l.anuncio)) return false;
        if (hasCampanhaFilter) {
          // O lead só conhece NOME CRIATIVO (= ad.name na Meta). A campanha vem da Meta via adCampaign.
          // Se não der pra mapear (criativo ausente na Meta), o lead fica fora quando o filtro está ativo.
          const camp = (adCampaign && l.criativo) ? adCampaign[l.criativo] : null;
          if (!camp || !campanhas.has(camp)) return false;
        }
        if (fromK != null || toK != null) {
          const dd = parseLeadDay(l.data);
          if (!dd) return false;
          const dk = dayKey(dd);
          if (fromK != null && dk < fromK) return false;
          if (toK   != null && dk > toK)   return false;
        }
        return true;
      });
    }

    function aggregate(leads, meta, filters) {
      const spendDaily          = meta && meta.spendDaily          || null;
      const impressionsDaily    = meta && meta.impressionsDaily    || null;
      const reachDaily          = meta && meta.reachDaily          || null;
      const reachMonthly        = meta && meta.reachMonthly        || null;
      const newMsgContactsDaily = meta && meta.newMsgContactsDaily || null;
      const thumbnails          = meta && meta.thumbnails          || null;
      const adAdset             = meta && meta.adAdset             || null;

      // Quando o filtro de tempo é exatamente UM ano + UM mês (sem calendário), conseguimos
      // usar reach_monthly (alcance único de calendário, vindo direto da Meta — bate com o Ads Manager).
      // Outros filtros (multi-mês, custom range) caem na soma diária aproximada.
      const singleMonthKey = (
        filters &&
        filters.years   && filters.years.size   === 1 &&
        filters.months  && filters.months.size  === 1 &&
        !filters.dateFrom && !filters.dateTo
      ) ? `${[...filters.years][0]}-${[...filters.months][0]}` : null;

      const byCriativo = new Map();
      const perfisTotal = {};
      let total = 0, sql = 0;
      for (const l of leads) {
        total++;
        const isSql = SQL_PERFIS.has(l.perfil);
        if (isSql) sql++;
        const p = l.perfil || "(sem perfil)";
        perfisTotal[p] = (perfisTotal[p] || 0) + 1;
        if (!l.criativo) continue;
        if (!byCriativo.has(l.criativo)) byCriativo.set(l.criativo, { name: l.criativo, total: 0, sql: 0, perfis: {}, anuncios: new Set() });
        const e = byCriativo.get(l.criativo);
        e.total++;
        if (isSql) e.sql++;
        e.perfis[p] = (e.perfis[p] || 0) + 1;
        if (l.anuncio) e.anuncios.add(l.anuncio);
      }

      // Anúncios da Meta com gasto > 0 no período mas ainda sem lead na planilha.
      // Aparecem como cards "vazios" (0 leads) só com o valor investido. Quando
      // um lead com NOME CRIATIVO = ad.name entrar, o card preenche naturalmente.
      // Ocultados quando há filtro de anúncio ativo (não dá pra cruzar com ANUNCIO da planilha).
      if (spendDaily) {
        const criativosFilter = filters && filters.criativos;
        const anunciosFilter  = filters && filters.anuncios;
        const campanhasFilter = filters && filters.campanhas;
        const adCampaign      = (filters && filters.adCampaign) || {};
        const hasAnuncioFilter  = anunciosFilter  && anunciosFilter.size > 0;
        const hasCampanhaFilter = campanhasFilter && campanhasFilter.size > 0;
        if (!hasAnuncioFilter) {
          for (const adName in spendDaily) {
            if (byCriativo.has(adName)) continue;
            if (criativosFilter && criativosFilter.size > 0 && !criativosFilter.has(adName)) continue;
            if (hasCampanhaFilter) {
              const camp = adCampaign[adName];
              if (!camp || !campanhasFilter.has(camp)) continue;
            }
            const spend = spendInRange(spendDaily[adName], filters);
            if (spend <= 0) continue;
            byCriativo.set(adName, { name: adName, total: 0, sql: 0, perfis: {}, anuncios: new Set() });
          }
        }
      }

      const criativos = [...byCriativo.values()]
        .map(e => {
          const spend       = spendDaily       ? spendInRange(spendDaily[e.name],       filters) : null;
          const impressions = impressionsDaily ? spendInRange(impressionsDaily[e.name], filters) : null;
          // reach: usa reach_monthly[ad][YYYY-MM] quando o filtro é exatamente 1 mês de calendário
          // (vem da Meta como alcance único). Senão soma daily (aproximado).
          let reach;
          if (singleMonthKey && reachMonthly && reachMonthly[e.name]) {
            reach = reachMonthly[e.name][singleMonthKey] ?? 0;
          } else {
            reach = reachDaily ? spendInRange(reachDaily[e.name], filters) : null;
          }
          const newMsgContacts = newMsgContactsDaily ? spendInRange(newMsgContactsDaily[e.name], filters) : null;
          const cpl   = spend != null && e.total > 0 ? +(spend / e.total).toFixed(2) : null;
          const cpsql = spend != null && e.sql   > 0 ? +(spend / e.sql).toFixed(2)   : null;
          const firstDay = spendDaily ? firstSpendDay(spendDaily[e.name]) : null;
          return {
            ...e,
            anuncios: [...e.anuncios].sort((a, b) => a.localeCompare(b, "pt-BR")),
            sql_pct: e.total ? +(100 * e.sql / e.total).toFixed(2) : 0,
            spend, cpl, cpsql,
            impressions, reach, new_msg_contacts: newMsgContacts,
            adset: adAdset ? (adAdset[e.name] || null) : null,
            thumbnail: thumbnails ? (thumbnails[e.name] || null) : null,
            first_spend_day: firstDay,
            days_running: daysSince(firstDay),
          };
        })
        .sort((a, b) => (b.total - a.total) || ((b.spend || 0) - (a.spend || 0)));
      const totalSpend = spendDaily ? criativos.reduce((s, c) => s + (c.spend || 0), 0) : null;
      return {
        total,
        total_sql: sql,
        sql_pct: total ? +(100 * sql / total).toFixed(2) : 0,
        total_spend: totalSpend != null ? +totalSpend.toFixed(2) : null,
        cpl_avg:   totalSpend != null && total > 0 ? +(totalSpend / total).toFixed(2) : null,
        cpsql_avg: totalSpend != null && sql   > 0 ? +(totalSpend / sql).toFixed(2)   : null,
        criativos,
        perfis_total: perfisTotal,
      };
    }

    function Header({ hasLiveApi, refreshing, onRefresh }) {

        <header className="flex items-center justify-between px-6 lg:px-10 py-5 border-b border-[#2B0C55]/10 backdrop-blur-sm">
          <div className="flex items-center gap-3">
            <span className="relative inline-grid place-items-center w-9 h-9">
              <span className="w-4 h-4 rounded-full"
                    style={{ background: "linear-gradient(135deg,#6A52B3,#63C19B)",
                             boxShadow: "0 0 22px rgba(106,82,179,.55), 0 0 40px rgba(99,193,155,.4)" }} />
            </span>
            <div className="flex flex-col leading-tight">
              <span className="text-[17px] font-bold tracking-wide"
                    style={{ background:"linear-gradient(120deg,#9C84EA 0%,#8A6DD1 45%,#63C19B 100%)",
                             WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" }}>
                Vesti
              </span>
              <span className="text-[10.5px] uppercase tracking-[1.6px] text-slate-500">Mídia Paga · Performance</span>
            </div>
          </div>

          <div className="flex items-center gap-3">
            {hasLiveApi && (

                style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
                title="Puxar dados ao vivo (planilha + Meta) agora">
                <span style={{ display: "inline-block", animation: refreshing ? "spin .9s linear infinite" : "none" }}>⟳</span>
                {refreshing ? "Atualizando…" : "Atualizar"}
              </button>
            )}
            <a href="index.html"
               className="inline-flex items-center gap-1.5 text-xs text-slate-700 border border-[#2B0C55]/10 rounded-lg px-3 py-2 hover:text-slate-900 hover:border-brand-pink hover:bg-brand-pink/10 transition"
               title="Voltar ao dashboard">
              <svg viewBox="0 0 20 20" width="14" height="14">

              </svg>
              Dashboard
            </a>
            <a href="etapas.html"
               className="relative inline-flex items-center gap-1.5 text-xs font-semibold text-white rounded-lg px-3.5 py-2 shadow-[0_8px_20px_rgba(106,82,179,.35)] hover:shadow-[0_10px_26px_rgba(106,82,179,.5)] hover:-translate-y-0.5 transition"
               style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
               title="Ver etapas do funil de leads">

                <path d="M3 4h14l-3 5 3 5H3l3-5-3-5Z" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
              </svg>
              Etapas
            </a>
            <a href="meta.html"
               className="relative inline-flex items-center gap-1.5 text-xs font-semibold text-white rounded-lg px-3.5 py-2 shadow-[0_8px_20px_rgba(106,82,179,.35)] hover:shadow-[0_10px_26px_rgba(106,82,179,.5)] hover:-translate-y-0.5 transition"
               style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
               title="Ver metas mensais e trimestrais">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" strokeWidth="1.8"/>
                <circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" strokeWidth="1.8"/>
                <circle cx="10" cy="10" r="1" fill="currentColor"/>
              </svg>
              Comparação com metas
            </a>
            <button onClick={logout}
              className="inline-flex items-center gap-1.5 text-xs text-slate-700 border border-[#2B0C55]/10 rounded-lg px-3 py-2 hover:text-slate-900 hover:border-brand-pink hover:bg-brand-pink/10 transition"
              title="Encerrar sessão">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <path d="M12 4H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h7M9 10h8m0 0-3-3m3 3-3 3"

                      strokeLinecap="round" strokeLinejoin="round"/>

          </div>
        </header>
      );
    }

    function KpiCard({ label, value, sub, accent }) {
      return (
        <div className="card p-5">
          <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500">{label}</div>
          <div className="mt-1 text-3xl font-semibold tabular-nums"
               style={{ color: "#ffffff" }}>
            {value}
          </div>
          {sub && <div className="mt-1 text-xs text-slate-500">{sub}</div>}
        </div>
      );
    }

    function HighlightKpi({ label, value, sub }) {
      return (
        <div className="card p-5 relative overflow-hidden">
          <div className="absolute inset-0 pointer-events-none"
               style={{ background: "linear-gradient(135deg, rgba(106,82,179,0.08) 0%, rgba(99,193,155,0.06) 100%)" }} />
          <div className="absolute left-0 top-0 bottom-0 w-1 rounded-l-2xl"
               style={{ background: "linear-gradient(180deg,#6A52B3 0%,#63C19B 100%)" }} />
          <div className="relative">
            <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500">{label}</div>
            <div className="mt-1 text-4xl font-bold tabular-nums"
                 style={{ color: "#ffffff" }}>
              {value}
            </div>
            {sub && <div className="mt-1 text-xs text-slate-500">{sub}</div>}
          </div>
        </div>
      );
    }

    function PerfilChart({ perfis, total }) {
      const knownPerfis = new Set(PERFIL_ORDER);
      const extras = Object.keys(perfis || {}).filter(p => !knownPerfis.has(p)).sort((x, y) => x.localeCompare(y, "pt-BR"));
      const ordered = [...PERFIL_ORDER, ...extras].filter(p => (perfis[p] || 0) > 0);
      if (ordered.length === 0) return null;
      // Comprimento visual da barra é proporcional ao maior perfil (para a barra mais alta
      // preencher a faixa). A % mostrada dentro da barra continua sendo fatia do TOTAL de leads.
      const max = Math.max(...ordered.map(p => perfis[p]));
      return (
        <section className="card p-5">
          <div className="flex items-center justify-between mb-1">
            <h2 className="text-base font-semibold">Distribuição por perfil</h2>
            <span className="text-xs text-slate-500">{ordered.length} perfil(is)</span>
          </div>

    function CalendarPopover({ from, to, onApply, onClose, onClear }) {
      const today = useMemo(() => dateOnly(new Date()), []);
      const initView = from || to || today;
      const [viewY, setViewY] = useState(initView.getFullYear());
      const [viewM, setViewM] = useState(initView.getMonth());
      const [draftFrom, setDraftFrom] = useState(from);
      const [draftTo, setDraftTo]     = useState(to);

      const prev = () => { const m = viewM-1; if (m < 0) { setViewY(viewY-1); setViewM(11); } else setViewM(m); };
      const next = () => { const m = viewM+1; if (m > 11) { setViewY(viewY+1); setViewM(0); } else setViewM(m); };

      const onPick = (d) => {
        if (!draftFrom || (draftFrom && draftTo)) { setDraftFrom(d); setDraftTo(null); return; }
        if (d < draftFrom) { setDraftTo(draftFrom); setDraftFrom(d); return; }
        setDraftTo(d);
      };

      const grid = useMemo(() => {
        const first = new Date(viewY, viewM, 1);
        const startDow = first.getDay();
        const cells = [];
        for (let i = 0; i < startDow; i++) cells.push(addDays(first, i - startDow));
        const lastDay = new Date(viewY, viewM+1, 0).getDate();
        for (let d = 1; d <= lastDay; d++) cells.push(new Date(viewY, viewM, d));
        while (cells.length % 7 !== 0) cells.push(addDays(cells[cells.length-1], 1));
        while (cells.length < 42) cells.push(addDays(cells[cells.length-1], 1));
        return cells;
      }, [viewY, viewM]);

      const inRange = (d) => {
        if (!draftFrom) return false;
        const dk = dayKey(d), a = dayKey(draftFrom);
        const b = draftTo ? dayKey(draftTo) : a;
        return dk >= a && dk <= b;
      };
      const presetRange = (days) => {
        const end = today;
        const start = addDays(end, -(days-1));
        setDraftFrom(start); setDraftTo(end);
        setViewY(end.getFullYear()); setViewM(end.getMonth());
      };
      const presetMonth = (offset) => {
        const ref = new Date(today.getFullYear(), today.getMonth()+offset, 1);
        const end = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
        setDraftFrom(ref); setDraftTo(end);
        setViewY(ref.getFullYear()); setViewM(ref.getMonth());
      };

      return (
        <div className="absolute left-0 mt-2 w-[320px] bg-white border border-[#2B0C55]/10 rounded-xl shadow-xl p-3"
             style={{ zIndex: 60 }}>
          <div className="flex items-center justify-between mb-2">
            <button onClick={prev} className="p-1.5 rounded-md hover:bg-[#6A52B3]/10" aria-label="Mês anterior">
              <svg width="14" height="14" viewBox="0 0 20 20"><path d="M12 5l-5 5 5 5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <div className="text-sm font-semibold text-slate-800">{MESES_LONG[viewM]} {viewY}</div>
            <button onClick={next} className="p-1.5 rounded-md hover:bg-[#6A52B3]/10" aria-label="Próximo mês">
              <svg width="14" height="14" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-[10px] text-slate-400 uppercase tracking-[1.4px] text-center mb-1">
            {DOW_HEADERS.map((d,i) => <div key={i}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1 text-xs">
            {grid.map((d, i) => {
              const isCurMonth = d.getMonth() === viewM;
              const isToday    = dayKey(d) === dayKey(today);
              const sel        = inRange(d);
              const isStart    = draftFrom && dayKey(d) === dayKey(draftFrom);
              const isEnd      = draftTo   && dayKey(d) === dayKey(draftTo);
              const isEdge     = isStart || isEnd;
              return (
                <button key={i} onClick={() => onPick(d)}
                        className={[
                          "h-8 rounded-md tabular-nums transition",
                          !isCurMonth ? "text-slate-300" : "text-slate-700",
                          sel && !isEdge ? "bg-[#6A52B3]/15 text-[#2B0C55]" : "",
                          isEdge ? "text-white font-semibold" : "",
                          !sel && !isEdge ? "hover:bg-slate-100" : "",
                          isToday && !isEdge ? "ring-1 ring-[#6A52B3]/30" : "",
                        ].join(" ")}
                        style={isEdge ? { background: "linear-gradient(135deg,#6A52B3,#549E86)" } : {}}>
                  {d.getDate()}
                </button>
              );
            })}
          </div>
          <div className="mt-3 flex flex-wrap gap-1.5">
            {[
              { label: "Hoje",        run: () => { setDraftFrom(today); setDraftTo(today); } },
              { label: "Últimos 7d",  run: () => presetRange(7) },
              { label: "Últimos 30d", run: () => presetRange(30) },
              { label: "Este mês",    run: () => presetMonth(0) },
              { label: "Mês passado", run: () => presetMonth(-1) },
            ].map(p => (
              <button key={p.label} onClick={p.run}
                      className="text-[11px] px-2 py-1 rounded-md border border-[#2B0C55]/10 text-slate-600 hover:bg-[#6A52B3]/10 hover:text-[#2B0C55] transition">
                {p.label}
              </button>
            ))}
          </div>
          <div className="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3">
            <button onClick={() => { onClear(); onClose(); }}
                    className="text-xs text-slate-500 hover:text-slate-700 underline-offset-2 hover:underline">
              Limpar
            </button>
            <div className="flex items-center gap-2">
              <button onClick={onClose}
                      className="text-xs px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100">
                Cancelar
              </button>
              <button onClick={() => { onApply(draftFrom, draftTo || draftFrom); onClose(); }}
                      disabled={!draftFrom}
                      className="text-xs px-3 py-1.5 rounded-md text-white font-semibold disabled:opacity-50"
                      style={{ background: "linear-gradient(120deg,#6A52B3,#63C19B)" }}>
                Aplicar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CalendarButton({ from, to, onChange }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", h);
        return () => document.removeEventListener("mousedown", h);
      }, []);
      const hasRange = from || to;
      const label = hasRange
        ? (from && to && dayKey(from) === dayKey(to) ? fmtDateShort(from) : `${fmtDateShort(from)} – ${fmtDateShort(to || from)}`)
        : "Calendário";
      return (
        <div ref={ref} className="relative">
          <button type="button" onClick={() => setOpen(o => !o)}
                  className={SELECT_CLS + " flex items-center gap-2 justify-between min-w-[200px]"}>
            <span className="flex items-center gap-2 truncate">
              <svg viewBox="0 0 20 20" width="14" height="14" className="shrink-0 text-[#6A52B3]">
                <path d="M5 4v2M15 4v2M3 8h14M4 6h12a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
              </svg>
              <span className={`truncate ${hasRange ? "text-slate-800 font-medium" : "text-slate-500"}`}>{label}</span>
            </span>
            <svg width="10" height="10" viewBox="0 0 20 20" className="shrink-0"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
          {open && (
            <CalendarPopover from={from} to={to}
              onApply={(a, b) => onChange(a, b || a)}

              onClear={() => onChange(null, null)} />
          )}
        </div>
      );
    }

    function MultiSelectDropdown({ allLabel, pluralLabel, options, selected, onChange, displayFn, minWidth = 180, popoverWidth = "w-64" }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", onClick);
        return () => document.removeEventListener("mousedown", onClick);
      }, []);

      const display = displayFn || ((v) => v);
      const label = selected.size === 0
        ? allLabel
        : selected.size === 1
          ? display([...selected][0])
          : `${selected.size} ${pluralLabel}`;

      const toggle = (v) => {
        const next = new Set(selected);
        if (next.has(v)) next.delete(v); else next.add(v);
        onChange(next);
      };

      return (
        <div ref={ref} className="relative">
          <button type="button" onClick={() => setOpen(o => !o)}
                  className={SELECT_CLS + " flex items-center gap-2 justify-between"}
                  style={{ minWidth: `${minWidth}px`, maxWidth: "280px" }}>
            <span className="truncate">{label}</span>
            <svg width="10" height="10" viewBox="0 0 20 20" className="shrink-0"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
          {open && (
            <div className={`absolute left-0 mt-2 ${popoverWidth} bg-white border border-[#2B0C55]/10 rounded-lg shadow-xl max-h-72 overflow-y-auto`}
                 style={{ zIndex: 50 }}>
              {options.length === 0 ? (
                <div className="px-3 py-3 text-xs text-slate-400">Nenhuma opção disponível</div>
              ) : options.map(v => {
                const checked = selected.has(v);
                return (
                  <label key={v} className="flex items-center gap-2 px-3 py-2 hover:bg-[#6A52B3]/5 cursor-pointer text-sm">
                    <input type="checkbox" checked={checked} onChange={() => toggle(v)} />
                    <span className="truncate">{display(v)}</span>
                  </label>
                );
              })}
              {selected.size > 0 && (
                <button onClick={() => onChange(new Set())}
                        className="w-full text-left px-3 py-2 text-xs text-slate-500 border-t border-slate-100 hover:bg-slate-50 sticky bottom-0 bg-white">
                  Limpar seleção
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [selectedYears, setSelectedYears] = useState(new Set());
      const [selectedMonths, setSelectedMonths] = useState(new Set());
      const [selectedCriativos, setSelectedCriativos] = useState(new Set());
      const [selectedAnuncios, setSelectedAnuncios] = useState(new Set());
      const [selectedCampanhas, setSelectedCampanhas] = useState(new Set());
      const [dateFrom, setDateFrom] = useState(null);
      const [dateTo, setDateTo] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [refreshedAt, setRefreshedAt] = useState(null);

      // Detecta se estamos na Cloudflare Pages ou localhost (tem /api ao vivo).
      const hasLiveApi = /(^|\.)pages\.dev\.?$/.test(location.hostname) || location.hostname.replace(/\.$/, "") === "localhost" || location.hostname.replace(/\.$/, "") === "bi.vesti.com.br";

      // Snapshot estático (data/data.json): primeiro paint rápido, quase nunca falha.
      const loadSnapshot = React.useCallback(async () => {
        try {
          const r = await fetch("data/data.json?t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          setData(await r.json());
          setErr(null);
        } catch (e) {
          setErr(e.message || String(e));
        }
      }, []);

      // Ao vivo (/api/dados): background no load (fresh=false) e forçado no botão (fresh=true).
      // Nunca bloqueia o primeiro paint; se falhar, mantém o snapshot na tela — sem erro.
      const loadLive = React.useCallback(async (fresh) => {
        if (!hasLiveApi) return;
        setRefreshing(true);
        try {
          const r = await fetch("api/dados" + (fresh ? "?fresh=1" : ""), { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          setData(await r.json());
          setErr(null);
          setRefreshedAt(new Date());
        } catch (e) {
          setRefreshedAt(null);
        } finally {
          setRefreshing(false);
        }
      }, [hasLiveApi]);

      // Load inicial: snapshot primeiro (instantâneo), depois ao vivo em background.
      useEffect(() => {
        (async () => { await loadSnapshot(); loadLive(false); })();
      }, [loadSnapshot, loadLive]);

      const chanelLeads = (data && data.midia_paga && data.midia_paga.chanel && data.midia_paga.chanel.leads) || [];

      const months = useMemo(() => {
        const set = new Set();
        for (const l of chanelLeads) {
          const k = leadMonthKey(l.data);
          if (k) set.add(k);
        }
        return [...set].sort().reverse();
      }, [chanelLeads]);

      // Inicializa filtro no ano + mês mais recente assim que os dados chegam
      useEffect(() => {
        if (selectedYears.size === 0 && months.length) {
          const [y, mm] = months[0].split("-");
          setSelectedYears(new Set([y]));
          setSelectedMonths(new Set([mm]));
        }
      }, [months]);

      const adCampaign = (data && data.midia_paga && data.midia_paga.ad_campaign) || {};
      const adAdset    = (data && data.midia_paga && data.midia_paga.ad_adset)    || {};

      // Cada lista de opções é calculada a partir dos leads filtrados pelos *outros* filtros.
      // Isso torna os dropdowns cascateados: filtrar por mês reduz criativos/anúncios disponíveis.
      const leadsForYears = useMemo(
        () => applyFilters(chanelLeads, { months: selectedMonths, criativos: selectedCriativos, anuncios: selectedAnuncios, campanhas: selectedCampanhas, adCampaign, dateFrom, dateTo }),
        [chanelLeads, selectedMonths, selectedCriativos, selectedAnuncios, selectedCampanhas, adCampaign, dateFrom, dateTo]
      );
      const leadsForMonths = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, criativos: selectedCriativos, anuncios: selectedAnuncios, campanhas: selectedCampanhas, adCampaign, dateFrom, dateTo }),
        [chanelLeads, selectedYears, selectedCriativos, selectedAnuncios, selectedCampanhas, adCampaign, dateFrom, dateTo]
      );
      const leadsForCriativos = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, months: selectedMonths, anuncios: selectedAnuncios, campanhas: selectedCampanhas, adCampaign, dateFrom, dateTo }),
        [chanelLeads, selectedYears, selectedMonths, selectedAnuncios, selectedCampanhas, adCampaign, dateFrom, dateTo]
      );
      const leadsForAnuncios = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, months: selectedMonths, criativos: selectedCriativos, campanhas: selectedCampanhas, adCampaign, dateFrom, dateTo }),
        [chanelLeads, selectedYears, selectedMonths, selectedCriativos, selectedCampanhas, adCampaign, dateFrom, dateTo]
      );
      const leadsForCampanhas = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, months: selectedMonths, criativos: selectedCriativos, anuncios: selectedAnuncios, dateFrom, dateTo }),
        [chanelLeads, selectedYears, selectedMonths, selectedCriativos, selectedAnuncios, dateFrom, dateTo]
      );

      // Inclui sempre o que está selecionado (mesmo se filtrar pra zero), para a usuária conseguir desmarcar.
      const unionSorted = (arr, selectedSet, cmp) => {
        const set = new Set([...arr, ...selectedSet]);
        return [...set].filter(Boolean).sort(cmp);
      };

      // Dados da Meta precisam estar declarados antes dos available* porque
      // availableCriativos lê spendDaily (e também passa como dep do useMemo).
      const spendDaily       = (data && data.midia_paga && data.midia_paga.spend_daily)        || null;
      const impressionsDaily = (data && data.midia_paga && data.midia_paga.impressions_daily)  || null;
      const reachDaily       = (data && data.midia_paga && data.midia_paga.reach_daily)        || null;
      const reachMonthly     = (data && data.midia_paga && data.midia_paga.reach_monthly)      || null;
      const newMsgContactsDaily = (data && data.midia_paga && data.midia_paga.new_msg_contacts_daily) || null;
      const thumbnails       = (data && data.midia_paga && data.midia_paga.thumbnails)         || null;
      const campaigns        = (data && data.midia_paga && data.midia_paga.campaigns)          || [];
      const campaignByName = useMemo(() => {
        const m = {};
        for (const c of campaigns) m[c.name] = c;
        return m;
      }, [campaigns]);

      const availableYears = useMemo(() => {
        const s = new Set();
        for (const l of leadsForYears) { const k = leadMonthKey(l.data); if (k) s.add(k.split("-")[0]); }
        return unionSorted([...s], selectedYears, (a, b) => b.localeCompare(a));
      }, [leadsForYears, selectedYears]);

      const availableMonthNums = useMemo(() => {
        const s = new Set();
        for (const l of leadsForMonths) { const k = leadMonthKey(l.data); if (k) s.add(k.split("-")[1]); }
        return unionSorted([...s], selectedMonths, (a, b) => a.localeCompare(b));
      }, [leadsForMonths, selectedMonths]);

      const availableCriativos = useMemo(() => {
        const s = new Set();
        for (const l of leadsForCriativos) { if (l.criativo) s.add(l.criativo); }
        // Inclui ad names da Meta com gasto > 0 no período cascateado mesmo sem lead.
        // Mesma regra dos cards: sem filtro de anúncio ativo (não tem como cruzar).
        if (spendDaily && selectedAnuncios.size === 0) {
          const f = { years: selectedYears, months: selectedMonths, dateFrom, dateTo };
          const hasCampanhaFilter = selectedCampanhas.size > 0;
          for (const adName in spendDaily) {
            if (s.has(adName)) continue;
            if (hasCampanhaFilter) {
              const c = adCampaign[adName];
              if (!c || !selectedCampanhas.has(c)) continue;
            }
            if (spendInRange(spendDaily[adName], f) > 0) s.add(adName);
          }
        }
        return unionSorted([...s], selectedCriativos, (a, b) => a.localeCompare(b, "pt-BR"));
      }, [leadsForCriativos, selectedCriativos, spendDaily, adCampaign, selectedYears, selectedMonths, selectedAnuncios, selectedCampanhas, dateFrom, dateTo]);

      const availableAnuncios = useMemo(() => {
        const s = new Set();
        for (const l of leadsForAnuncios) { if (l.anuncio) s.add(l.anuncio); }
        return unionSorted([...s], selectedAnuncios, (a, b) => a.localeCompare(b, "pt-BR"));
      }, [leadsForAnuncios, selectedAnuncios]);

      const availableCampanhas = useMemo(() => {
        const s = new Set();
        // Campanhas dos leads no recorte cascateado (exceto filtro de campanha em si).
        for (const l of leadsForCampanhas) {
          const c = l.criativo ? adCampaign[l.criativo] : null;
          if (c) s.add(c);
        }
        // Campanhas de ads Meta-only com gasto no período (cascateado por ano/mês/calendário e criativo).
        // Mesma regra do availableCriativos: só conta quando não há filtro de anúncio ativo.
        if (spendDaily && selectedAnuncios.size === 0) {
          const f = { years: selectedYears, months: selectedMonths, dateFrom, dateTo };
          const hasCriativoFilter = selectedCriativos.size > 0;
          for (const adName in spendDaily) {
            const c = adCampaign[adName];
            if (!c) continue;
            if (hasCriativoFilter && !selectedCriativos.has(adName)) continue;
            if (spendInRange(spendDaily[adName], f) > 0) s.add(c);
          }
        }
        return unionSorted([...s], selectedCampanhas, (a, b) => a.localeCompare(b, "pt-BR"));
      }, [leadsForCampanhas, selectedCampanhas, spendDaily, adCampaign, selectedYears, selectedMonths, selectedCriativos, selectedAnuncios, dateFrom, dateTo]);

      const m = useMemo(() => {
        if (!chanelLeads.length) return null;
        const filters = {
          years: selectedYears, months: selectedMonths,
          criativos: selectedCriativos, anuncios: selectedAnuncios,
          campanhas: selectedCampanhas, adCampaign,
          dateFrom, dateTo,
        };
        const meta = { spendDaily, impressionsDaily, reachDaily, reachMonthly, newMsgContactsDaily, thumbnails, adAdset };
        return aggregate(applyFilters(chanelLeads, filters), meta, filters);
      }, [chanelLeads, spendDaily, impressionsDaily, reachDaily, reachMonthly, newMsgContactsDaily, thumbnails, adAdset, adCampaign, selectedYears, selectedMonths, selectedCriativos, selectedAnuncios, selectedCampanhas, dateFrom, dateTo]);

      return (
        <>
          <Header hasLiveApi={hasLiveApi} refreshing={refreshing} onRefresh={() => loadLive(true)} />
          <main className="px-6 lg:px-10 py-8 max-w-6xl mx-auto space-y-6">
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 className="text-xl font-semibold">Mídia Paga</h1>
                <p className="text-sm text-slate-500">Performance dos criativos sobre os leads gerados.</p>
              </div>
              <div className="flex items-center gap-4 flex-wrap">
                {data && (
                  <div className="text-xs text-slate-500">
                    Atualizado em {new Date(data.generated_at).toLocaleString("pt-BR")} · fonte: {data.sheet_tab}
                  </div>
                )}
              </div>
            </div>

            {data && months.length > 0 && (
              <div className="card px-5 py-4 flex items-center justify-between flex-wrap gap-3 relative" style={{ zIndex: 30 }}>
                <div className="flex items-center flex-wrap gap-3">
                  <MultiSelectDropdown
                    allLabel="Todos os meses"
                    pluralLabel="meses selecionados"
                    options={availableMonthNums}
                    selected={selectedMonths}
                    onChange={setSelectedMonths}
                    displayFn={(mm) => MESES_LONG[+mm - 1]}
                    minWidth={170}
                    popoverWidth="w-56"
                  />
                  <MultiSelectDropdown
                    allLabel="Todos os anos"
                    pluralLabel="anos selecionados"
                    options={availableYears}
                    selected={selectedYears}
                    onChange={setSelectedYears}
                    minWidth={140}
                    popoverWidth="w-40"
                  />
                  <MultiSelectDropdown
                    allLabel="Todos os criativos"
                    pluralLabel="criativos selecionados"
                    options={availableCriativos}
                    selected={selectedCriativos}
                    onChange={setSelectedCriativos}
                    minWidth={220}
                    popoverWidth="w-80"
                  />
                  <MultiSelectDropdown
                    allLabel="Todos os anúncios"
                    pluralLabel="anúncios selecionados"
                    options={availableAnuncios}
                    selected={selectedAnuncios}
                    onChange={setSelectedAnuncios}
                    minWidth={220}
                    popoverWidth="w-80"
                  />
                  <MultiSelectDropdown
                    allLabel="Todas as campanhas"
                    pluralLabel="campanhas selecionadas"
                    options={availableCampanhas}
                    selected={selectedCampanhas}
                    onChange={setSelectedCampanhas}
                    displayFn={(name) => {
                      const c = campaignByName[name];
                      return (c && c.effective_status && c.effective_status !== "ACTIVE") ? `${name} · pausada` : name;
                    }}
                    minWidth={220}
                    popoverWidth="w-80"
                  />
                  <CalendarButton from={dateFrom} to={dateTo}
                    onChange={(a, b) => { setDateFrom(a); setDateTo(b); }} />
                </div>
                {(selectedYears.size > 0 || selectedMonths.size > 0 || selectedCriativos.size > 0 || selectedAnuncios.size > 0 || selectedCampanhas.size > 0 || dateFrom || dateTo) && (
                  <button onClick={() => {
                            setSelectedYears(new Set());
                            setSelectedMonths(new Set());
                            setSelectedCriativos(new Set());
                            setSelectedAnuncios(new Set());
                            setSelectedCampanhas(new Set());
                            setDateFrom(null); setDateTo(null);
                          }}
                          className="text-xs text-slate-600 underline-offset-2 hover:underline">
                    Limpar filtros
                  </button>
                )}
              </div>
            )}

            {err && (
              <div className="card p-5 text-sm text-rose-700 border-rose-200">Erro ao carregar dados: {err}</div>
            )}

            {!data && !err && (
              <div className="card p-10 text-center text-slate-400 text-sm">Carregando…</div>
            )}

            {m && (
              <>
                <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <HighlightKpi label="Leads" value={fmtNumber(m.total)} sub="Origem Mídia Paga" />
                  <KpiCard label="SQL" value={fmtNumber(m.total_sql)} sub="Pro · Starter · Qualificado" accent />
                  <KpiCard label="Taxa SQL" value={fmtPct(m.sql_pct)} sub="SQL ÷ Leads" accent />
                </section>

                {m.total_spend != null && (
                  <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <KpiCard label="Investimento" value={fmtBRL(m.total_spend)} sub="Meta Ads no período" accent />
                    <KpiCard label="CPL médio" value={fmtBRL(m.cpl_avg)} sub="Investimento ÷ Leads" />
                    <KpiCard label="CPSQL médio" value={fmtBRL(m.cpsql_avg)} sub="Investimento ÷ SQL" />
                  </section>
                )}

                <PerfilChart perfis={m.perfis_total} total={m.total} />

                <section className="space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-semibold">Resumo por criativo</h2>
                      <p className="text-xs text-slate-500">
                        Composição de perfis, total de leads e SQL para cada criativo.
                      </p>
                    </div>
                    <span className="text-xs text-slate-500">{m.criativos.length} criativo(s)</span>
                  </div>
                  {m.criativos.length === 0 ? (
                    <div className="card px-6 py-10 text-center text-sm text-slate-400">
                      Nenhum criativo identificado para esta seleção.
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {m.criativos.map(c => <CriativoCard key={c.name} c={c} />)}
                    </div>
                  )}
                </section>
              </>
            )}
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
