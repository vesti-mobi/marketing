    .card {

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }

<body class="font-sans antialiased overflow-x-hidden">
  <div class="bg-grid"></div>

  <div class="orb orb-2"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;
    const {
      ResponsiveContainer, BarChart, Bar, LineChart, Line,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, LabelList, Cell
    } = Recharts;

    const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const MESES_LONG = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const fmtNumber = (n) => (n == null ? "—" : new Intl.NumberFormat("pt-BR").format(n));
    const fmtPct = (n) => (n == null || !isFinite(n) ? "—" : `${n.toFixed(1).replace(".", ",")}%`);
    const monthKey = (y, m) => `${y}-${String(m).padStart(2, "0")}`;

    // dd/mm/aaaa hh:mm:ss  → { y, m, d }
    function parseLeadDate(str) {
      if (!str) return null;
      const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (!m) return null;
      return { y: +m[3], m: +m[2], d: +m[1] };
    }

    // Semana de domingo a sábado. Semana 1 = dia 1 até o primeiro sábado.
    function weekOfMonth(year, monthIdx, day) {
      const firstDow = new Date(year, monthIdx, 1).getDay();
      const firstSatDay = 1 + ((6 - firstDow + 7) % 7);
      if (day <= firstSatDay) return 1;
      return 1 + Math.ceil((day - firstSatDay) / 7);
    }
    function weeksInMonth(year, monthIdx) {
      const lastDay = new Date(year, monthIdx + 1, 0).getDate();
      return weekOfMonth(year, monthIdx, lastDay);
    }
    function weekBounds(year, monthIdx, weekNum) {
      const firstDow = new Date(year, monthIdx, 1).getDay();
      const firstSatDay = 1 + ((6 - firstDow + 7) % 7);
      const lastDay = new Date(year, monthIdx + 1, 0).getDate();
      let start, end;
      if (weekNum === 1) { start = 1; end = Math.min(firstSatDay, lastDay); }
      else {
        start = firstSatDay + 1 + (weekNum - 2) * 7;
        end = Math.min(start + 6, lastDay);
      }
      if (start > lastDay) return null;
      return { start, end };
    }
    function weekRange(year, monthIdx, weekNum) {
      const b = weekBounds(year, monthIdx, weekNum);
      if (!b) return null;
      return `${String(b.start).padStart(2,"0")}–${String(b.end).padStart(2,"0")}`;
    }
    function daysInWeek(year, monthIdx, weekNum) {
      const b = weekBounds(year, monthIdx, weekNum);
      return b ? (b.end - b.start + 1) : 0;
    }
    function daysInMonth(year, monthIdx) {
      return new Date(year, monthIdx + 1, 0).getDate();
    }

    // Agrega os contadores em vários meses (lista de {y, m}).
    // dateField: "data" = safra (entrada, col A) · "data_etapa" = competência (col K).
    function countForMonths(leads, monthObjs, dateField = "data") {
      const wanted = new Set(monthObjs.map(o => monthKey(o.y, o.m)));
      let total = 0, pro = 0, starter = 0, quali = 0;
      for (const l of leads) {
        const d = parseLeadDate(l[dateField]);
        if (!d || !wanted.has(monthKey(d.y, d.m))) continue;
        total++;
        const p = (l.perfil || "").trim().toLowerCase();
        if (p === "pro") pro++;
        else if (p === "starter") starter++;
        else if (p.startsWith("qualificado")) quali++;
      }
      return { total, pro, starter, quali, sql: pro + starter + quali };
    }

    function availableMonths(leads) {
      const set = new Set();
      for (const l of leads) {
        const d = parseLeadDate(l.data);
        if (d) set.add(`${d.y}-${String(d.m).padStart(2,"0")}`);
      }
      return Array.from(set).sort().reverse().map(k => {
        const [y, m] = k.split("-");
        return { y: +y, m: +m };
      });
    }

    function Header({ hasLiveApi, refreshing, onRefresh }) {
      const logout = () => window.VestiAuth.logout();
      return (
        <header className="flex items-center justify-between px-6 lg:px-10 py-5 border-b border-[#2B0C55]/10 backdrop-blur-sm">
          <div className="flex items-center gap-3">
            <span className="relative inline-grid place-items-center w-9 h-9">
              <span className="w-4 h-4 rounded-full"
                    style={{ background: "linear-gradient(135deg,#6A52B3,#63C19B)",
                             boxShadow: "0 0 22px rgba(106,82,179,.55), 0 0 40px rgba(99,193,155,.4)" }} />
            </span>
            <div className="flex flex-col leading-tight">
              <span className="text-[17px] font-bold tracking-wide"
                    style={{ background:"linear-gradient(120deg,#9C84EA 0%,#8A6DD1 45%,#63C19B 100%)",
                             WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" }}>
                Vesti
              </span>
              <span className="text-[10.5px] uppercase tracking-[1.6px] text-slate-500">Metas · Comparativo</span>
            </div>
          </div>

          <div className="flex items-center gap-3">
            {hasLiveApi && (
              <button onClick={onRefresh} disabled={refreshing}
                className="relative inline-flex items-center gap-1.5 text-xs font-semibold text-white rounded-lg px-3.5 py-2 shadow-[0_8px_20px_rgba(106,82,179,.35)] hover:shadow-[0_10px_26px_rgba(106,82,179,.5)] hover:-translate-y-0.5 transition disabled:opacity-60 disabled:cursor-default"
                style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
                title="Puxar dados ao vivo (planilha + Meta) agora">
                <span style={{ display: "inline-block", animation: refreshing ? "spin .9s linear infinite" : "none" }}>⟳</span>
                {refreshing ? "Atualizando…" : "Atualizar"}
              </button>
            )}
            <a href="index.html"
               className="inline-flex items-center gap-1.5 text-xs text-slate-700 border border-[#2B0C55]/10 rounded-lg px-3 py-2 hover:text-slate-900 hover:border-brand-pink hover:bg-brand-pink/10 transition"
               title="Voltar ao dashboard">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <path d="M12 5l-5 5 5 5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Dashboard
            </a>
            <a href="etapas.html"
               className="relative inline-flex items-center gap-1.5 text-xs font-semibold text-white rounded-lg px-3.5 py-2 shadow-[0_8px_20px_rgba(106,82,179,.35)] hover:shadow-[0_10px_26px_rgba(106,82,179,.5)] hover:-translate-y-0.5 transition"
               style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
               title="Ver etapas do funil de leads">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <path d="M3 4h14l-3 5 3 5H3l3-5-3-5Z" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
              </svg>
              Etapas
            </a>
            <a href="midia-paga.html"
               className="relative inline-flex items-center gap-1.5 text-xs font-semibold text-white rounded-lg px-3.5 py-2 shadow-[0_8px_20px_rgba(106,82,179,.35)] hover:shadow-[0_10px_26px_rgba(106,82,179,.5)] hover:-translate-y-0.5 transition"
               style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
               title="Ver dados de mídia paga">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <path d="M3 8v4l10 4V4L3 8Z" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
                <path d="M13 7c1.5 1 1.5 5 0 6" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
              Mídia Paga
            </a>
            <button onClick={logout}
              className="inline-flex items-center gap-1.5 text-xs text-slate-700 border border-[#2B0C55]/10 rounded-lg px-3 py-2 hover:text-slate-900 hover:border-brand-pink hover:bg-brand-pink/10 transition"
              title="Encerrar sessão">
              Sair
            </button>
          </div>
        </header>
      );
    }

    // Seletor de múltiplos meses via chips, filtrados por um ano (dropdown).
    // `selected` é uma lista de chaves "YYYY-MM"; a seleção pode abranger vários anos.
    function MonthMultiSelector({ months, years, filterYear, onYearChange, selected, onToggle, onAllYear, onClearYear }) {
      const monthsOfYear = months.filter(x => x.y === filterYear).sort((a, b) => a.m - b.m);
      return (
        <div className="flex flex-wrap items-center gap-x-3 gap-y-2">
          <label className="text-sm text-slate-600">Ano:</label>
          <select value={filterYear} onChange={e => onYearChange(+e.target.value)}
                  className="bg-white/80 border border-[#2B0C55]/10 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand-pink">
            {years.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
          <span className="text-sm text-slate-600">Meses:</span>
          <div className="flex flex-wrap items-center gap-1.5">
            {monthsOfYear.map(({ y, m }) => {
              const k = monthKey(y, m);
              const on = selected.includes(k);
              return (
                <button key={k} type="button" onClick={() => onToggle(k)}
                  aria-pressed={on}
                  className="px-2.5 py-1 text-xs font-semibold rounded-md border transition"
                  style={on
                    ? { background: "linear-gradient(120deg,#6A52B3,#63C19B)", color: "#fff", borderColor: "transparent" }
                    : { color: "#a299c6", borderColor: "rgba(255,255,255,0.10)", background: "rgba(255,255,255,0.04)" }}>
                  {MESES[m-1]}
                </button>
              );
            })}
          </div>
          <div className="inline-flex items-center gap-1 text-[11px]"
               title="Aplica-se aos meses do ano selecionado acima">
            <button type="button" onClick={onAllYear}
              className="text-slate-500 hover:text-slate-800 underline-offset-2 hover:underline">Todos</button>
            <span className="text-slate-600">·</span>
            <button type="button" onClick={onClearYear}
              className="text-slate-500 hover:text-slate-800 underline-offset-2 hover:underline">Limpar</button>
          </div>
        </div>
      );
    }

    function MetaCard({ label, realizado, meta, unit = "" , tone = "purple"}) {
      const pct = meta > 0 ? (realizado / meta) * 100 : 0;
      const ok = pct >= 100;
      const barBg = ok
        ? "linear-gradient(90deg, #3E8C6E, #2F6B56)"
        : "linear-gradient(90deg, #C84A6E, #E48AA3)";
      return (
        <div className="card card-gradient-border p-5">
          <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500 mb-1">{label}</div>
          <div className="flex items-baseline gap-2">
            <span className="text-3xl font-bold text-slate-900">{fmtNumber(realizado)}{unit}</span>
            <span className="text-sm text-slate-500">/ {fmtNumber(meta)}{unit}</span>
          </div>
          <div className="mt-3 h-2 rounded-full bg-[#2B0C55]/10 overflow-hidden">
            <div className="h-full rounded-full transition-all"
                 style={{ width: `${Math.min(100, pct)}%`, background: barBg }} />
          </div>
          <div className="mt-2 flex items-center justify-between text-xs">
            <span className={ok ? "text-emerald-600 font-semibold" : "font-semibold"}
                  style={ok ? null : { color: "#C84A6E" }}>
              {fmtPct(pct)} da meta
            </span>
            <span className="text-slate-400">
              {ok ? "✓ atingido" : `faltam ${fmtNumber(Math.max(0, meta - realizado))}`}
            </span>
          </div>
        </div>
      );
    }

    function CountCard({ label, value, hint }) {
      return (
        <div className="card card-gradient-border p-5">
          <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500 mb-1">{label}</div>
          <div className="text-3xl font-bold text-slate-900">{fmtNumber(value)}</div>
          {hint && <div className="mt-2 text-xs text-slate-500">{hint}</div>}
        </div>
      );
    }

    function PctCard({ label, realizadoNum, realizadoDen, metaNum, metaDen, hint }) {
      const realPct = realizadoDen > 0 ? (realizadoNum / realizadoDen) * 100 : 0;
      const metaPct = metaDen > 0 ? (metaNum / metaDen) * 100 : 0;
      const ok = realPct >= metaPct;
      const ratio = metaPct > 0 ? (realPct / metaPct) * 100 : 0;
      return (
        <div className="card card-gradient-border p-5">
          <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500 mb-1">{label}</div>
          <div className="flex items-baseline gap-2">
            <span className="text-3xl font-bold text-slate-900">{fmtPct(realPct)}</span>
            <span className="text-sm text-slate-500">/ meta {fmtPct(metaPct)}</span>
          </div>
          <div className="mt-3 h-2 rounded-full bg-[#2B0C55]/10 overflow-hidden">
            <div className="h-full rounded-full transition-all"
                 style={{ width: `${Math.min(100, ratio)}%`,
                          background: ok
                            ? "linear-gradient(90deg, #3E8C6E, #2F6B56)"
                            : "linear-gradient(90deg, #C84A6E, #E48AA3)" }} />
          </div>
          <div className="mt-2 text-xs text-slate-500">{hint}</div>
        </div>
      );
    }

    function weeklySeries(leads, year, month, metaMensal, matchFn, seriesKey, dateField = "data") {
      const monthIdx = month - 1;
      const nWeeks = weeksInMonth(year, monthIdx);
      const buckets = Array(nWeeks).fill(0);
      for (const l of leads) {
        const d = parseLeadDate(l[dateField]);
        if (!d || d.y !== year || d.m !== month) continue;
        if (!matchFn(l)) continue;
        const w = weekOfMonth(year, monthIdx, d.d);
        if (w >= 1 && w <= nWeeks) buckets[w-1]++;
      }
      const metaDia = metaMensal / daysInMonth(year, monthIdx);
      return buckets.map((v, i) => {
        const dias = daysInWeek(year, monthIdx, i+1);
        return {
          label: `Sem ${i+1}`,
          range: weekRange(year, monthIdx, i+1),
          dias,
          [seriesKey]: v,
          Meta: Math.round(metaDia * dias * 10) / 10,
        };
      });
    }

    // Série com um ponto por mês selecionado (cronológica). Meta = meta mensal fixa.
    function monthlySeries(leads, monthObjs, metaMensal, matchFn, seriesKey, dateField = "data") {
      return monthObjs.map(({ y, m }) => {
        let v = 0;
        for (const l of leads) {
          const d = parseLeadDate(l[dateField]);
          if (!d || d.y !== y || d.m !== m) continue;
          if (matchFn(l)) v++;
        }
        return {
          label: `${MESES[m-1]}/${String(y).slice(2)}`,
          [seriesKey]: v,
          Meta: metaMensal,
        };
      });
    }

    function isSqlLead(l) {
      const p = (l.perfil || "").trim().toLowerCase();
      return p === "pro" || p === "starter" || p.startsWith("qualificado");
    }
    function isProLead(l) {
      return (l.perfil || "").trim().toLowerCase() === "pro";
    }

    function WeeklyLineChart({ rows, seriesKey, title, subtitle, mainColor = "#6A52B3", mainColorDark = "#8A6DD1" }) {
      return (
        <div className="card card-gradient-border p-5">
          <div className="flex items-baseline justify-between mb-3">
            <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500">{title}</div>
            <div className="text-[11px] text-slate-400">{subtitle}</div>
          </div>
          <div style={{ width: "100%", height: 360 }}>
            <ResponsiveContainer>
              <LineChart data={rows} margin={{ top: 32, right: 24, left: 36, bottom: 24 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.10)" />
                <XAxis dataKey="label" tick={{ fill: "#a299c6", fontSize: 12 }} padding={{ left: 16, right: 16 }} />
                <YAxis tick={{ fill: "#a299c6", fontSize: 12 }} allowDecimals={false}
                       domain={[0, (dataMax) => Math.max(5, Math.ceil(dataMax * 1.25))]} />
                <Tooltip
                  formatter={(v, name) => [fmtNumber(v), name]}
                  labelFormatter={(lbl, payload) => {
                    const p = payload && payload[0] && payload[0].payload;
                    const r = p && p.range;
                    const d = p && p.dias;
                    return r ? `${lbl} (${r}) · ${d} dia${d === 1 ? "" : "s"}` : lbl;
                  }}
                />
                <Legend wrapperStyle={{ paddingTop: 8 }} />
                <Line type="monotone" dataKey="Meta" stroke="#63C19B" strokeWidth={2}
                      strokeDasharray="6 4" dot={{ r: 3, fill: "#63C19B" }} activeDot={{ r: 5 }}>
                  <LabelList dataKey="Meta" position="top" offset={10}
                             style={{ fill: "#63C19B", fontSize: 10, fontWeight: 600 }} />
                </Line>
                <Line type="monotone" dataKey={seriesKey} stroke={mainColor} strokeWidth={2.5}
                      dot={{ r: 4, fill: mainColor }} activeDot={{ r: 6 }}>
                  <LabelList dataKey={seriesKey} position="bottom" offset={12}
                             style={{ fill: mainColorDark, fontSize: 11, fontWeight: 700 }} />
                </Line>
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    function ComparativoChart({ rows }) {
      return (
        <div className="card card-gradient-border p-5">
          <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500 mb-3">Realizado × Meta</div>
          <div style={{ width: "100%", height: 340 }}>
            <ResponsiveContainer>
              <BarChart data={rows} margin={{ top: 16, right: 16, left: 0, bottom: 8 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.10)" />
                <XAxis dataKey="label" tick={{ fill: "#a299c6", fontSize: 12 }} />
                <YAxis tick={{ fill: "#a299c6", fontSize: 12 }} />
                <Tooltip formatter={(v) => fmtNumber(v)} />
                <Legend wrapperStyle={{ paddingTop: 8 }} />
                <Bar dataKey="Realizado" fill="#6A52B3" radius={[6,6,0,0]}>
                  <LabelList dataKey="Realizado" position="top" style={{ fill: "#cdbff2", fontSize: 11, fontWeight: 600 }} />
                </Bar>
                <Bar dataKey="Meta" fill="#63C19B" radius={[6,6,0,0]}>
                  <LabelList dataKey="Meta" position="top" style={{ fill: "#2F6B56", fontSize: 11, fontWeight: 600 }} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    function App() {
      const [leads, setLeads] = useState(null);
      const [metas, setMetas] = useState(null);
      const [err, setErr] = useState(null);
      // Meses selecionados: lista de chaves "YYYY-MM".
      const [selected, setSelected] = useState([]);
      // Ano que filtra os chips de mês exibidos (a seleção pode abranger vários anos).
      const [filterYear, setFilterYear] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [refreshedAt, setRefreshedAt] = useState(null);

      // Detecta se estamos na Cloudflare Pages ou localhost (tem /api ao vivo).
      const hasLiveApi = /(^|\.)pages\.dev\.?$/.test(location.hostname) || location.hostname.replace(/\.$/, "") === "localhost" || location.hostname.replace(/\.$/, "") === "bi.vesti.com.br";

      // Aplica o payload (leads filtrados + metas). `initial` só na 1ª carga (snapshot),
      // para auto-selecionar o mês corrente; nas atualizações de background não mexe na
      // seleção do usuário. `m` opcional — no ao-vivo as metas já vieram do snapshot.
      const applyPayload = React.useCallback((d, m, { initial }) => {
        const filtered = (d.leads || []).filter(l => {
          const origem = (l.origem || "").trim();
          const perfil = (l.perfil || "").trim().toLowerCase();
          if (origem === "Evento Denim") return false;
          if (perfil === "suporte" || perfil === "cs") return false;
          return true;
        });
        setLeads(filtered);
        if (m) setMetas(m);
        if (initial) {
          const months = availableMonths(filtered);
          if (months.length) {
            const today = new Date();
            const ty = today.getFullYear(), tm = today.getMonth() + 1;
            const match = months.find(x => x.y === ty && x.m === tm) || months[0];
            setSelected([monthKey(match.y, match.m)]);
            setFilterYear(match.y);
          }
        }
      }, []);

      // Snapshot estático (data.json + metas.json): primeiro paint rápido, quase nunca falha.
      const loadSnapshot = React.useCallback(async () => {
        try {
          const [d, m] = await Promise.all([
            fetch("data/data.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
            fetch("data/metas.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()),
          ]);
          applyPayload(d, m, { initial: true });
          setErr(null);
        } catch (e) {
          setErr(String(e));
        }
      }, [applyPayload]);

      // Ao vivo (/api/dados): background no load (fresh=false) e forçado no botão (fresh=true).
      // Nunca bloqueia o primeiro paint; se falhar, mantém o snapshot na tela — sem erro.
      const loadLive = React.useCallback(async (fresh) => {
        if (!hasLiveApi) return;
        setRefreshing(true);
        try {
          const r = await fetch("api/dados" + (fresh ? "?fresh=1" : ""), { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          applyPayload(await r.json(), null, { initial: false });
          setErr(null);
          setRefreshedAt(new Date());
        } catch (e) {
          setRefreshedAt(null);
        } finally {
          setRefreshing(false);
        }
      }, [applyPayload, hasLiveApi]);

      // Load inicial: snapshot primeiro (instantâneo), depois ao vivo em background.
      useEffect(() => {
        (async () => { await loadSnapshot(); loadLive(false); })();
      }, [loadSnapshot, loadLive]);

      const months = useMemo(() => leads ? availableMonths(leads) : [], [leads]);
      const years = useMemo(() => Array.from(new Set(months.map(x => x.y))).sort((a, b) => b - a), [months]);
      // Ano resolvido (fallback enquanto o estado inicializa).
      const fy = filterYear ?? years[0] ?? null;
      // Fonte de data fixa: coluna DATA (data de entrada do lead).
      const dateField = "data";
      // Meses selecionados como objetos {y, m}, em ordem cronológica (ascendente).
      const selMonths = useMemo(() =>
        months
          .filter(x => selected.includes(monthKey(x.y, x.m)))
          .sort((a, b) => a.y - b.y || a.m - b.m),
        [months, selected]);
      const counts = useMemo(() => {
        if (!leads || !selMonths.length) return null;
        return countForMonths(leads, selMonths, dateField);
      }, [leads, selMonths, dateField]);

      if (err) return <div className="p-10 text-red-600">Erro: {err}</div>;
      if (!leads || !metas) return <div className="p-10 text-slate-500">Carregando…</div>;

      const nSel = selMonths.length;
      const singleMonth = nSel === 1;
      const metaBase = metas.mensal;
      // Meta agregada = meta mensal × nº de meses selecionados.
      const meta = {
        total_leads: metaBase.total_leads * nSel,
        sql: metaBase.sql * nSel,
        pro: metaBase.pro * nSel,
        starter: metaBase.starter * nSel,
      };
      const periodLabel = nSel === 1
        ? `${MESES_LONG[selMonths[0].m-1]}/${selMonths[0].y}`
        : `${nSel} meses (${selMonths.map(o => `${MESES[o.m-1]}/${String(o.y).slice(2)}`).join(", ")})`;

      const chartRows = counts ? [
        { label: "Total de leads", Realizado: counts.total, Meta: meta.total_leads },
        { label: "SQL", Realizado: counts.sql, Meta: meta.sql },
        { label: "Pro", Realizado: counts.pro, Meta: meta.pro },
        { label: "Starter", Realizado: counts.starter, Meta: meta.starter },
      ] : [];
      // 1 mês → série semanal; vários meses → série por mês.
      const sqlRows = singleMonth
        ? weeklySeries(leads, selMonths[0].y, selMonths[0].m, metaBase.sql, isSqlLead, "SQL", dateField)
        : monthlySeries(leads, selMonths, metaBase.sql, isSqlLead, "SQL", dateField);
      const proRows = singleMonth
        ? weeklySeries(leads, selMonths[0].y, selMonths[0].m, metaBase.pro, isProLead, "Pro", dateField)
        : monthlySeries(leads, selMonths, metaBase.pro, isProLead, "Pro", dateField);
      const sqlTitle = singleMonth ? "SQLs por semana × meta" : "SQLs por mês × meta";
      const proTitle = singleMonth ? "Pros por semana × meta" : "Pros por mês × meta";
      const chartSub  = singleMonth ? "meta proporcional aos dias de cada semana" : "meta mensal fixa por mês";

      return (
        <>
          <Header hasLiveApi={hasLiveApi} refreshing={refreshing} onRefresh={() => loadLive(true)} />
          <main className="max-w-6xl mx-auto px-6 lg:px-10 py-8">
            <div className="flex flex-col gap-4 mb-6">
              <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                <div>
                  <h1 className="text-2xl font-bold tracking-tight"
                      style={{ background:"linear-gradient(120deg,#9C84EA 0%,#8A6DD1 45%,#63C19B 100%)",
                               WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" }}>
                    Metas mensais
                  </h1>
                  <p className="text-sm text-slate-500 mt-1">
                    {nSel === 0
                      ? <>Selecione ao menos um mês nos chips abaixo.</>
                      : <>Comparativo entre o realizado e a meta em <strong>{periodLabel}</strong>.{nSel > 1 ? <> Meta = mensal × {nSel} meses.</> : null} <span className="text-slate-400">(Excluídos: origem <strong>Evento Denim</strong> e perfis <strong>Suporte</strong>/<strong>CS</strong>)</span></>}
                  </p>
                </div>
              </div>
              <div className="card p-3">
                <MonthMultiSelector
                  months={months}
                  years={years}
                  filterYear={fy}
                  onYearChange={(y) => setFilterYear(y)}
                  selected={selected}
                  onToggle={(k) => setSelected(prev => prev.includes(k) ? prev.filter(x => x !== k) : [...prev, k])}
                  onAllYear={() => {
                    const yk = months.filter(x => x.y === fy).map(x => monthKey(x.y, x.m));
                    setSelected(prev => Array.from(new Set([...prev, ...yk])));
                  }}
                  onClearYear={() => {
                    const yk = new Set(months.filter(x => x.y === fy).map(x => monthKey(x.y, x.m)));
                    setSelected(prev => prev.filter(k => !yk.has(k)));
                  }} />
              </div>
            </div>

            {nSel === 0 ? (
              <div className="card p-8 text-center text-slate-500">
                Selecione ao menos um mês nos chips acima para ver as metas.
              </div>
            ) : (
              <>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
                  <MetaCard label="Total de leads" realizado={counts.total} meta={meta.total_leads} />
                  <MetaCard label="SQL"            realizado={counts.sql}   meta={meta.sql} />
                  <MetaCard label="Leads Pro"      realizado={counts.pro}   meta={meta.pro} />
                  <MetaCard label="Leads Starter"  realizado={counts.starter} meta={meta.starter} />
                  <CountCard label="Qualificados (Sem Faixa)" value={counts.quali}
                             hint="incluídos no total de SQL" />
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                  <div className="lg:col-span-2">
                    <ComparativoChart rows={chartRows} />
                  </div>
                  <PctCard label="% Pro sobre SQL"
                           realizadoNum={counts.pro} realizadoDen={counts.sql}
                           metaNum={meta.pro}        metaDen={meta.sql}
                           hint={`${counts.pro} de ${counts.sql} SQLs são Pro`} />
                </div>

                <div className="mt-4 grid grid-cols-1 gap-4">
                  <WeeklyLineChart rows={sqlRows} seriesKey="SQL"
                                   title={sqlTitle} subtitle={chartSub} />
                  <WeeklyLineChart rows={proRows} seriesKey="Pro"
                                   title={proTitle} subtitle={chartSub} />
                </div>
              </>
            )}
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <style>
    .card-gradient-border { position: relative; }
    .card-gradient-border::before {
      content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg,#6A52B3,transparent 35%,transparent 65%,#63C19B);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; opacity: 0.45;
    }
  </style>
</body>
</html>
