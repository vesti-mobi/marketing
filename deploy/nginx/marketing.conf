# Snippet do painel de Marketing — incluído no server{} de bi.vesti.com.br (uma linha include).
# Estático em /marketing/ + API ao vivo /marketing/api/ (proxy p/ o backend Flask/gunicorn).
# Espelha o padrão do /kpis.

# redireciona /marketing (sem barra) -> /marketing/
location = /marketing { return 301 /marketing/; }

# API ao vivo -> backend Flask (gunicorn 127.0.0.1:5002). A barra final reescreve /marketing/api/ -> /api/.
location /marketing/api/ {
    proxy_pass http://127.0.0.1:5002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 200s;   # a Meta pode demorar
}

# Estático do dashboard.
location = /marketing/ { root /var/www; try_files /marketing/index.html =404; }
location /marketing/   { root /var/www; try_files $uri $uri/ =404; }
